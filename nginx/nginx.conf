events {}

http {
    upstream nodos {
        server nodo1:443 max_fails=3 fail_timeout=10s;
        server nodo2:443 max_fails=3 fail_timeout=10s;
        server nodo3:443 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 443 ssl;
        # server_name 100.109.236.53;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://nodos;
            proxy_ssl_verify off;
            proxy_next_upstream error timeout http_502 http_503;
            add_header X-Nodo $upstream_addr always;
        }
    }
}